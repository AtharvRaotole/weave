name: Bug report
description: Something in the runtime, bindings, weave-mcp or the benchmark harness behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The script or command, what you expected, and what you got (full error text).
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: A Weave script plus the tool registrations, or a `weave` CLI command. Remove secrets and private data.
      render: python
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: "weave 1.0.0 (python -m weave.cli --version), Python 3.12, macOS 15 arm64"
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security issue (those go to the private process in SECURITY.md).
          required: true
