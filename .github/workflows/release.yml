name: release

# Builds wheels and an sdist when a version tag is pushed, and on manual runs.
# Only official CPython 3.9-3.13 wheels are kept (runners may also have 3.14+,
# free-threaded, or PyPy interpreters; those wheels are discarded). The `pypi`
# job publishes to PyPI only when the repository variable PYPI_PUBLISH is
# "true" and the run is a v* tag. See docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          # macos-13 runners are retired and never pick up jobs; cross-compile
          # x86_64 on the arm runner instead.
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
      - name: build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
      - name: smoke test the native wheel
        if: (matrix.os != 'macos-latest' && (matrix.target == 'x86_64' || matrix.target == 'x64')) || (matrix.os == 'macos-latest' && matrix.target == 'aarch64')
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist weave-lang
          python -c "import weave; e = weave.Engine(); assert e.run('print(1 + 1)\n').stdout == '2\n'; print('wheel ok')"
          # Cross-platform isolation gate: runaway tools are killed on this OS.
          python tests/python/test_isolation.py
      - name: keep only official CPython 3.9-3.13 wheels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          official = re.compile(r"^weave_lang-.+-cp(39|310|311|312|313)-cp(39|310|311|312|313)-.+\.whl$")
          kept, removed = [], []
          for p in Path("dist").glob("*.whl"):
              if official.match(p.name):
                  kept.append(p.name)
              else:
                  p.unlink()
                  removed.append(p.name)
          print("kept:", *sorted(kept), sep="\n  ")
          print("removed:", *sorted(removed), sep="\n  ")
          if not kept:
              sys.exit("no official CPython 3.9-3.13 wheels left in dist")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    # Opt-in trusted publishing (no API token). Skipped unless the repo variable
    # PYPI_PUBLISH is "true" and the run is for a v* tag. The `pypi` environment
    # must exist and must match the pending publisher registered on pypi.org.
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: keep only official CPython 3.9-3.13 wheels and the sdist
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          official = re.compile(r"^weave_lang-.+-cp(39|310|311|312|313)-cp(39|310|311|312|313)-.+\.whl$")
          sdist = re.compile(r"^weave_lang-.+\.tar\.gz$")
          kept, removed = [], []
          for p in Path("dist").iterdir():
              if not p.is_file():
                  continue
              if official.match(p.name) or sdist.match(p.name):
                  kept.append(p.name)
              else:
                  p.unlink()
                  removed.append(p.name)
          print("kept:", *sorted(kept), sep="\n  ")
          print("removed:", *sorted(removed), sep="\n  ")
          wheels = [n for n in kept if n.endswith(".whl")]
          sdists = [n for n in kept if n.endswith(".tar.gz")]
          if not wheels or not sdists:
              sys.exit("expected official wheels and an sdist in dist")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
