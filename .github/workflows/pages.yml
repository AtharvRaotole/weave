name: playground

# Builds the browser playground (Weave compiled to WebAssembly) and publishes
# it to GitHub Pages. Pull requests build and test it without deploying.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/weave/**"
      - "crates/weave-wasm/**"
      - "playground/**"
      - "scripts/build-playground.sh"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: virtual-time tests
        run: |
          cargo test -p weave --features virtual-time --test virtual_time
          cargo test -p weave-wasm --features virtual-time
      - name: wasm-bindgen CLI (version from Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          echo "WASM_BINDGEN=/tmp/wasm-bindgen-${v}-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
      - name: build site
        run: scripts/build-playground.sh _site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: headless browser smoke test
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          (cd _site && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          python playground/tests/smoke.py http://localhost:8765/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
