name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - name: cargo test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: build wheel and run the example
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --release --out dist
          python -m pip install dist/*.whl
          python examples/speedup.py
          python examples/hard_deadline.py
          python -m weave.cli check examples/hello.weave --tool name=weather,effect=read,arity=1
          python -m weave.cli run examples/hello.weave --tool name=weather,effect=read,behavior=echo,arity=1
          cargo build -p weave-mcp
          python examples/mcp_client.py
