name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - name: cargo test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build wheel and run the example
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --release --out dist
          python -m pip install dist/*.whl
          python examples/quickstart.py
          python examples/demo.py --fast
          python examples/cancel_run.py
          python examples/speedup.py
          python examples/hard_deadline.py
          python examples/footprints.py
          python examples/failing_branch.py
          python examples/plan_preview.py
          python -m weave.cli check examples/hello.weave --tool name=weather,effect=read,arity=1
          python -m weave.cli run examples/hello.weave --tool name=weather,effect=read,behavior=echo,arity=1
          cargo build -p weave-mcp
          python examples/mcp_client.py
          python examples/real_mcp_upstream.py
          python examples/run_weave_tool.py
          python tests/python/test_agent_tool.py
          python tests/python/test_arg_check.py
          python -m pip install pytest && python -m pytest -q tests/python/test_plan.py tests/python/test_returns.py
          timeout 300 python tests/python/test_isolation.py
          timeout 120 python tests/python/test_privacy.py
          timeout 120 python tests/python/test_bounded_phases.py
          timeout 120 python tests/python/test_exit_after_timeout.py
          python -m pip install openai-agents
          python tests/python/test_agent_tool.py
          python -m pip install "langchain-core==1.8.1" "langgraph==1.2.22"
          python tests/python/test_integrations.py
          python examples/agents_sdk_agent.py
          python examples/langgraph_agent.py
          python examples/apps/dep_audit.py
          python examples/apps/repo_scan.py
          python -m venv /tmp/insttest
          PYTHON=/tmp/insttest/bin/python WEAVE_FIND_LINKS=dist sh scripts/install.sh
      - name: offline audit acceptance matrix
        run: |
          python tests/audit/test_adapters.py
          timeout 35 python tests/audit/test_cancellation.py
          python tests/audit/test_budgets.py
          python tests/audit/test_exceptions.py
          python tests/audit/test_python_sugar.py
          python tests/audit/test_python_idioms.py
          python tests/audit/test_replay.py
          python tests/audit/test_mcp.py
          python tests/audit/test_benchmark.py
          timeout 35 python tests/audit/test_workers.py
      - name: benchmark v4 harness (offline oracle, no network)
        run: |
          timeout 300 python bench/v4/tests/test_v4.py
          python -m bench.v4.run --mock --suite held_out --repeats 1 --latency-ms 0 --out /tmp/v4mock

  python-cross:
    # Isolation, privacy and bounded-phase guarantees on macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: build wheel and run guarantee tests
        shell: bash
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist weave-lang
          python tests/python/test_agent_tool.py
          python tests/python/test_isolation.py
          python tests/python/test_privacy.py
          python tests/python/test_bounded_phases.py

  reference-mcp:
    # Official MCP reference servers, pinned by lockfiles (npm ci / pip --require-hashes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install pinned reference servers
        run: |
          npm ci --prefix tests/compat --ignore-scripts --no-audit --no-fund
          python -m venv /tmp/gitserver
          /tmp/gitserver/bin/python -m pip install --require-hashes --no-deps -r tests/compat/requirements-git.txt
      - name: weave-mcp against filesystem, git and memory reference servers
        env:
          WEAVE_COMPAT_REQUIRED: "1"
          WEAVE_COMPAT_GIT_PYTHON: /tmp/gitserver/bin/python
        run: |
          cargo build -p weave-mcp --locked
          timeout 300 python tests/compat/test_reference_servers.py
