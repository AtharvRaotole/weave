[package]
name = "weave"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Parallel runtime for a small Python-like language aimed at agent tool calls"
readme = "../../README.md"

[dependencies]
futures = "0.3"
ruff_python_ast = "0.0.18"
ruff_python_parser = "0.0.18"
ruff_text_size = "0.0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

# Native builds use a multi-threaded runtime with real timers. wasm32 builds
# (and the `virtual-time` feature) drive a single-threaded runtime on a
# deterministic virtual clock instead; see src/rt.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[features]
# Run sessions on a single-threaded runtime with a virtual clock. Always on for
# wasm32. Sync, cooperative and isolated tools run inline (no threads), and
# speculation is disabled. Meant for the browser playground and its tests.
virtual-time = []
